{% extends 'colis/base.html' %}
{% block title %}Ajouter un Nouveau Colis{% endblock %}
{% block content %}
    <h1>Ajouter un Nouveau Colis</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Ajouter</button>
    </form>
    <a href="{% url 'liste_colis' %}" class="btn btn-secondary mt-3">Retour à la Liste des Colis</a>
{% endblock %}
