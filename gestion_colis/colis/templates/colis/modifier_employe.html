{% extends 'colis/base.html' %}
{% block title %}Modifier l'Employé {{ employe.user.username }}{% endblock %}
{% block content %}
    <h1>Modifier l'Employé {{ employe.user.username }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </form>
    <a href="{% url 'liste_employes' %}" class="btn btn-secondary mt-3">Retour à la Liste des Employés</a>
{% endblock %}
