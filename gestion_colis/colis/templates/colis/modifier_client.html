{% extends 'colis/base.html' %}
{% block title %}Modifier Client{% endblock %}
{% block content %}
    <h1>Modifier Client: {{ client.nom }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Affiche le formulaire -->
        <button type="submit" class="btn btn-primary">Enregistrer les Modifications</button>
        <a href="{% url 'liste_clients' %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
